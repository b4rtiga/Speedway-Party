# build.cfg - ustawienia budowania Speedway Party (czyta je Makefile)

# Muzyka w menu: nazwa katalogu w src/music/ z gotowym miksem *_s8.raw
# (PCM signed 8 bit mono, PAL okres 222). Dostepne:
#   BlackMotor   - "Black Motor", 13.3 s, 208 KiB (ADPCM: 104 KiB)
#   NightGrid    - "Night Grid",  27.4 s, 428 KiB (ADPCM: 214 KiB)
#   BRAK         - gra bez muzyki (oszczedza Chip RAM)
# Po zmianie wystarczy: make dist   (albo: make dist MUSIC=NightGrid)
MUSIC = BlackMotor

# Muzyka w 4-bitowym ADPCM (tools/adpcm.py): TAK - o polowe mniej pamieci, troche wiecej
# szumu; NIE - oryginalny PCM 8 bit. Odsluch: python tools/adpcm.py --wav data/music.raw m.wav
MUSIC_ADPCM = TAK
